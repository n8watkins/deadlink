# deadlink: this file is the repo's own, so release-kit apply leaves it alone
# (apply only rewrites a dependabot.yml that starts with its "# release-kit:" line).
# It is the kit's file plus the legacy-code entry at the end; when the kit changes
# its dependabot.yml, copy the new kit part in and keep the legacy entry.
#
# release-kit: a new kit release arrives as one update PR (the dev dependency and the workflow pins).
# One multi-ecosystem group, so the npm and github-actions updates land together:
# separate PRs would leave package.json and the workflows on different kit versions.
# No cooldown for the kit: Dependabot's default 3-day cooldown skips the newest
# tags, and for a git dependency it then proposes the newest older tag, even
# one below the installed version (a downgrade).
version: 2
multi-ecosystem-groups:
  release-kit:
    schedule:
      interval: daily
    # On the group: Dependabot rejects commit-message on an update in a group.
    commit-message:
      prefix: build
      include: scope
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["release-kit"]
    allow:
      - dependency-name: release-kit
    multi-ecosystem-group: release-kit
    cooldown:
      exclude: ["release-kit"]
  - package-ecosystem: github-actions
    directory: /
    patterns: ["n8watkins/release-kit*"]
    allow:
      - dependency-name: n8watkins/release-kit*
    multi-ecosystem-group: release-kit
    cooldown:
      exclude: ["n8watkins/release-kit*"]
  # Legacy 2025 code (api/, app/, tests/), kept for reference only and never
  # built or deployed (see README, "Legacy code"). Ignoring every dependency
  # here also stops Dependabot security update PRs for these manifests
  # (ignore applies to security updates; exclude-paths does not). Remove this
  # entry if that code is ever revived.
  - package-ecosystem: npm
    directories: ["/api", "/app", "/tests"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
