name: Deploy Dead Link Switchboard

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint --if-present
      
      - name: Run tests
        run: npm test
      
      - name: Run security audit
        run: npm audit --production

  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging-api.deadlink.io
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate environment config
        run: |
          echo "API_KEY_SALT=${{ secrets.STAGING_API_KEY_SALT }}" >> .env.staging
          echo "HASH_SALT=${{ secrets.STAGING_HASH_SALT }}" >> .env.staging
          echo "STRIPE_SECRET_KEY=${{ secrets.STAGING_STRIPE_SECRET_KEY }}" >> .env.staging
          echo "WEBHOOK_URL=${{ secrets.STAGING_WEBHOOK_URL }}" >> .env.staging
          echo "WEBHOOK_SECRET=${{ secrets.STAGING_WEBHOOK_SECRET }}" >> .env.staging
      
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          config: wrangler.staging.toml
          vars: |
            API_KEY_SALT
            HASH_SALT
            STRIPE_SECRET_KEY
            WEBHOOK_URL
            WEBHOOK_SECRET
      
      - name: Run health check
        run: |
          sleep 10
          curl -f https://staging-api.deadlink.io/health || exit 1
      
      - name: Run smoke tests
        run: npm run test:smoke:staging --if-present

  deploy-production:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://api.deadlink.io
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate environment config
        run: |
          echo "API_KEY_SALT=${{ secrets.PROD_API_KEY_SALT }}" >> .env.production
          echo "HASH_SALT=${{ secrets.PROD_HASH_SALT }}" >> .env.production
          echo "STRIPE_SECRET_KEY=${{ secrets.PROD_STRIPE_SECRET_KEY }}" >> .env.production
          echo "WEBHOOK_URL=${{ secrets.PROD_WEBHOOK_URL }}" >> .env.production
          echo "WEBHOOK_SECRET=${{ secrets.PROD_WEBHOOK_SECRET }}" >> .env.production
      
      - name: Create database backup
        run: |
          # This would run your backup script
          echo "Creating database backup..."
      
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          config: wrangler.prod.toml
          vars: |
            API_KEY_SALT
            HASH_SALT
            STRIPE_SECRET_KEY
            WEBHOOK_URL
            WEBHOOK_SECRET
      
      - name: Run health check
        run: |
          sleep 10
          curl -f https://api.deadlink.io/health || exit 1
      
      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            Production deployment completed successfully.
            
            Commit: ${{ github.sha }}
            Run ID: ${{ github.run_id }}
          draft: false
          prerelease: false
      
      - name: Notify deployment
        if: always()
        run: |
          # Send notification to Slack/Discord/etc
          echo "Deployment status: ${{ job.status }}"